<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flag Stats — Live Tracker</title>
<meta name="theme-color" content="#14171C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flag Stats">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#14171C; --panel:#1D222A; --panel2:#262D37; --panel3:#2F3947;
    --line:#333B46; --ink:#EDF1F5; --muted:#8A95A3; --muted2:#5C6673;
    --green:#1FA35F; --green-d:#14663f; --amber:#F2B138; --red:#E5484D; --blue:#4C86F0;
    --mono:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    overscroll-behavior:none;-webkit-user-select:none;user-select:none}
  button{font-family:inherit;color:inherit;border:none;cursor:pointer}
  .lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* App shell */
  #app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
  .tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .tab{flex:1;padding:14px 8px;background:none;font-size:12px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted2);border-bottom:2px solid transparent}
  .tab.on{color:var(--ink);border-bottom-color:var(--amber)}
  .view{flex:1;padding:14px;display:none}
  .view.on{display:block}

  /* Scoreboard */
  .board{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
  .scoreRow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .teamBox{text-align:center;padding:8px 6px;border-radius:10px;position:relative;min-width:0}
  .teamBox.pos{background:rgba(242,177,56,.12);box-shadow:inset 0 0 0 1px rgba(242,177,56,.45)}
  .teamName{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .teamScore{font-family:var(--mono);font-size:44px;font-weight:800;line-height:1}
  .posDot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--amber);margin-right:5px;vertical-align:middle}
  .vs{color:var(--muted2);font-weight:800;font-size:12px}
  .situ{display:flex;justify-content:center;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .situ div{text-align:center}
  .situ .v{font-family:var(--mono);font-weight:800;font-size:18px;margin-top:2px}

  /* Field */
  .fieldWrap{display:flex;gap:12px;margin-bottom:12px}
  .field{position:relative;flex:0 0 clamp(100px,32vw,164px);height:clamp(360px,58vh,600px);background:
    repeating-linear-gradient(0deg,var(--green-d) 0 8px,#125a37 8px 16px);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;cursor:crosshair}
  .ez{position:absolute;left:0;right:0;height:9%;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center}
  .ez.top{top:0}.ez.bot{bottom:0}
  .ez span{font-size:8px;letter-spacing:.1em;color:#cfe9d9;font-weight:800;transform:rotate(0)}
  .ytick{position:absolute;left:0;right:0;height:0;border-top:1px solid rgba(255,255,255,.18)}
  .ytick.mid{border-top:2px dashed rgba(242,177,56,.8)}
  .ynum{position:absolute;left:3px;font-size:8px;color:rgba(255,255,255,.55);font-family:var(--mono);transform:translateY(-50%)}
  .ball{position:absolute;left:50%;width:16px;height:16px;margin-left:-8px;margin-top:-8px;
    background:#fff;border-radius:50%;box-shadow:0 0 0 2px var(--bg),0 2px 6px rgba(0,0,0,.5);z-index:4}
  .pending{position:absolute;left:50%;width:14px;height:14px;margin-left:-7px;margin-top:-7px;
    background:var(--amber);border-radius:50%;box-shadow:0 0 0 2px var(--bg);z-index:5}
  .gainTag{position:absolute;left:50%;transform:translateX(-50%);background:var(--amber);color:#111;
    font-family:var(--mono);font-weight:800;font-size:11px;padding:1px 6px;border-radius:6px;z-index:6;white-space:nowrap}
  .fieldSide{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}

  /* Prompt + buttons */
  .prompt{font-size:13px;font-weight:700;color:var(--ink);min-height:18px}
  .readout{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;text-align:center}
  .modeToggle{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
  .modeToggle .mt{flex:1;padding:8px 6px;border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:800;letter-spacing:.03em}
  .modeToggle .mt.on{background:var(--panel3);color:var(--ink)}
  /* Larger tap targets mode */
  .bigui .btn{padding:20px 12px;font-size:17px}
  .bigui .btn.sm{padding:15px 10px;font-size:15px}
  .bigui .btn.big{padding:26px 12px;font-size:20px}
  .bigui .pChip{padding:14px 6px}
  .bigui .pChip .n{font-size:22px}
  .bigui .pChip .nm{font-size:10px}
  .bigui .pGrid{grid-template-columns:repeat(3,1fr)}
  .bigui .tab{padding:17px 8px;font-size:13px}
  /* Clock bar */
  .clockBar{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .clockBar .ct{font-family:var(--mono);font-weight:800;font-size:20px;min-width:64px;text-align:center}
  .clockBar .btn{padding:8px 12px;font-size:12px}
  /* Play log */
  .plog{margin-top:10px}
  .plogItem{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel2)}
  .plogItem .pi{flex:1;min-width:0}
  .plogItem .situ2{font-size:10px;color:var(--muted);font-family:var(--mono)}
  .plogItem .desc{font-size:12.5px;font-weight:600;margin-top:1px}
  .plogItem .x2{background:none;color:var(--muted2);font-size:16px;padding:2px 6px}
  .plogItem.scoring{border-color:rgba(242,177,56,.5)}
  .plogEdit{background:var(--panel3);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
  /* Standings */
  .stTable td,.stTable th{padding:7px 3px;font-size:11.5px}
  .stTable td:first-child{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Modal (replaces confirm/prompt, which don't work in installed PWAs) */
  .modalBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  .modal .mt2{font-weight:800;font-size:15px;margin-bottom:8px}
  .modal .warn{color:var(--red);font-weight:700;font-size:12px;margin:6px 0}
  .finalBadge{display:inline-block;background:var(--green);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:middle}
  .readout .rv{font-family:var(--mono);font-weight:800;font-size:24px;line-height:1.1;margin-top:2px}
  .readout .rg{font-family:var(--mono);font-size:13px;color:var(--amber);font-weight:700;margin-top:2px}
  .promptSub{font-size:11px;color:var(--muted);margin-top:2px}
  .btnGrid{display:grid;gap:8px}
  .btnGrid.c2{grid-template-columns:1fr 1fr}
  .btnGrid.c3{grid-template-columns:1fr 1fr 1fr}
  .btnGrid.c4{grid-template-columns:1fr 1fr 1fr 1fr}
  .btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px 10px;
    font-weight:800;font-size:15px;letter-spacing:.02em;transition:transform .04s,background .1s}
  .btn:active{transform:scale(.97)}
  .btn.big{padding:22px 10px;font-size:18px}
  .btn.green{background:var(--green);border-color:transparent}
  .btn.red{background:var(--red);border-color:transparent}
  .btn.blue{background:var(--blue);border-color:transparent}
  .btn.amber{background:var(--amber);color:#111;border-color:transparent}
  .btn.ghost{background:transparent;color:var(--muted)}
  .btn.sm{padding:11px 8px;font-size:13px}
  .btn:disabled{opacity:.4}

  /* Player grid */
  .pGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .pChip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center}
  .pChip .n{font-family:var(--mono);font-weight:800;font-size:18px}
  .pChip .nm{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pChip.sel{outline:2px solid var(--amber);background:var(--panel3)}
  .pChip.add{border-style:dashed;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:400}

  .barRow{display:flex;gap:8px;margin-top:10px}
  .barRow .btn{flex:1}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel3);
    border:1px solid var(--line);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;
    opacity:0;transition:opacity .2s;z-index:50;pointer-events:none}
  .toast.show{opacity:1}

  /* Box score */
  .bs{margin-top:6px}
  .bsTeam{font-weight:800;font-size:13px;margin:12px 0 6px;color:var(--amber)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:10px;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
  td:first-child,th:first-child{text-align:left}
  td.num{font-family:var(--mono)}
  .miniTag{display:inline-block;font-size:10px;color:var(--muted);margin-left:6px}

  /* Setup */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:14px}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px;font-size:14px;font-family:inherit}
  textarea{resize:vertical;min-height:90px;font-family:var(--mono);font-size:12px}
  .field2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  .rowline{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .rowline .num{width:52px}
  .rowline input.grow{flex:1}
  .x{background:none;color:var(--muted2);font-size:20px;padding:0 6px;line-height:1}
  .teamRow{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
  .teamRow .meta{font-size:11px;color:var(--muted)}
  .gameItem{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2)}
  .gameItem.active{outline:2px solid var(--amber)}
  .help{font-size:11px;color:var(--muted);line-height:1.5;margin-top:8px}
  .empty{text-align:center;color:var(--muted);padding:30px 12px;font-size:13px}
  a.dl{color:var(--blue);font-weight:700;text-decoration:none;font-size:13px}
  .flexbtns{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app">
  <div class="tabs">
    <button class="tab on" data-tab="game">Live</button>
    <button class="tab" data-tab="setup">Teams &amp; Games</button>
    <button class="tab" data-tab="tourney">Tournament</button>
  </div>

  <!-- ============ LIVE GAME ============ -->
  <div class="view on" id="view-game"></div>

  <!-- ============ SETUP ============ -->
  <div class="view" id="view-setup"></div>

  <!-- ============ TOURNAMENT ============ -->
  <div class="view" id="view-tourney"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   PERSISTENCE
   ============================================================ */
const LS_TEAMS='fs_teams_v1', LS_GAMES='fs_games_v1', LS_ACTIVE='fs_active_v1';
const store={
  load(k,d){ try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d} },
  save(k,v){ try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Storage full or blocked')} }
};
let teams=store.load(LS_TEAMS,{});   // { teamName: {name, players:[{id,num,name}]} }
let games=store.load(LS_GAMES,[]);   // [ game ]
let activeId=store.load(LS_ACTIVE,null);
let inputMode=store.load('fs_inputmode','field'); // 'field' | 'numeric'
function setInputMode(m){ inputMode=m; store.save('fs_inputmode',m); render(); }

/* ===== LIVE_CONFIG — filled in ONCE by whoever deploys the app. =====
   Deploy the included worker.js to Cloudflare (see README), then put its URL
   (and the same TOKEN you set there) here and push. From then on, every device
   that opens the app has live sync automatically — zero setup on the tablets. */
const LIVE_CONFIG={
  url:'https://flagstats-live.trizzey11.workers.dev',
  token:'prag2026-x7k9m2'
};
let deviceId=store.load('fs_device',null);
if(!deviceId){ deviceId=Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10); store.save('fs_device',deviceId); }
let prefs=store.load('fs_prefs',{clock:false,bigui:false,spotter:false});
function setPref(k,v){ prefs[k]=v; store.save('fs_prefs',prefs); applyPrefs(); render(); }
function applyPrefs(){ document.body.classList.toggle('bigui',!!prefs.bigui); }
function persist(){ store.save(LS_TEAMS,teams); store.save(LS_GAMES,games); store.save(LS_ACTIVE,activeId); schedulePush(); }
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---- In-app modal (browser confirm()/prompt() are silently blocked in installed PWAs) ---- */
function showModal(opts){
  closeModal();
  const bg=h(`<div class="modalBg" id="modalBg"></div>`);
  const m=h(`<div class="modal"></div>`);
  if(opts.title) m.appendChild(h(`<div class="mt2">${opts.title}</div>`));
  if(opts.body) m.appendChild(h(`<div class="help">${opts.body}</div>`));
  if(opts.warn) m.appendChild(h(`<div class="warn">⚠ ${opts.warn}</div>`));
  const vals={};
  (opts.inputs||[]).forEach(inp=>{
    m.appendChild(h(`<div class="lbl" style="margin:8px 0 4px">${inp.label||''}</div>`));
    const el=h(`<input value="${esc(inp.value||'')}" placeholder="${esc(inp.placeholder||'')}" ${inp.numeric?'inputmode="numeric"':''}>`);
    vals[inp.key]=inp.value||'';
    el.oninput=e=>{vals[inp.key]=e.target.value;};
    m.appendChild(el);
  });
  const bar=h(`<div class="barRow" style="margin-top:14px"></div>`);
  (opts.buttons||[]).forEach(b=>{
    const btn=h(`<button class="btn sm ${b.cls||'ghost'}">${b.label}</button>`);
    btn.onclick=()=>{ closeModal(); if(b.onTap) b.onTap(vals); };
    bar.appendChild(btn);
  });
  m.appendChild(bar); bg.appendChild(m);
  bg.onclick=(e)=>{ if(e.target===bg) closeModal(); };
  document.body.appendChild(bg);
}
function closeModal(){ const b=document.getElementById('modalBg'); if(b) b.remove(); }

/* ---- Test rosters: the 7 Nations Cup Prague teams, 15 placeholder players each ---- */
const TEST_NUMS=[3,5,7,8,9,10,11,12,14,18,21,22,24,44,88];
const TEST_POOLS={
 'Ireland':{f:['Aoife','Saoirse','Niamh','Ciara','Róisín','Sinéad','Orla','Caoimhe','Aisling','Clíona','Gráinne','Sadhbh','Fiadh','Éabha','Méabh'],
   l:['Murphy','Kelly',"O'Brien",'Ryan',"O'Sullivan",'Walsh','Byrne',"O'Connor",'Doyle','McCarthy','Gallagher','Kennedy','Lynch','Brennan','Fitzgerald']},
 'Finland':{f:['Aino','Emilia','Sofia','Venla','Ella','Helmi','Aada','Iida','Peppi','Siiri','Nea','Vilma','Enni','Sanni','Elli'],
   l:['Korhonen','Virtanen','Mäkinen','Nieminen','Mäkelä','Hämäläinen','Laine','Heikkinen','Koskinen','Järvinen','Lehtonen','Saarinen','Salminen','Heinonen','Niemi']},
 'Sweden':{f:['Alva','Astrid','Ebba','Elsa','Freja','Maja','Saga','Signe','Tuva','Wilma','Agnes','Ingrid','Klara','Linnéa','Stina'],
   l:['Andersson','Johansson','Karlsson','Nilsson','Eriksson','Larsson','Olsson','Persson','Svensson','Gustafsson','Lindberg','Bergström','Lundgren','Sandberg','Holm']},
 'Ukraine':{f:['Sofiia','Anastasiia','Mariia','Kateryna','Anna','Yuliia','Oksana','Iryna','Olena','Nataliia','Vira','Yana','Daria','Alina','Khrystyna'],
   l:['Shevchenko','Kovalenko','Bondarenko','Tkachenko','Melnyk','Kravchenko','Boyko','Marchenko','Lysenko','Rudenko','Moroz','Tkachuk','Savchenko','Polishchuk','Kravets']},
 'Poland':{f:['Zuzanna','Julia','Maja','Zofia','Lena','Alicja','Maria','Oliwia','Hanna','Amelia','Aleksandra','Natalia','Wiktoria','Emilia','Antonina'],
   l:['Nowak','Kowalska','Wiśniewska','Wójcik','Kowalczyk','Kamińska','Lewandowska','Zielińska','Szymańska','Woźniak','Dąbrowska','Kozłowska','Jankowska','Mazur','Kwiatkowska']},
 'Czechia':{f:['Tereza','Eliška','Anežka','Karolína','Barbora','Kristýna','Natálie','Adéla','Veronika','Klára','Markéta','Petra','Lucie','Zuzana','Nikola'],
   l:['Nováková','Svobodová','Dvořáková','Černá','Procházková','Kučerová','Veselá','Horáková','Marková','Pospíšilová','Benešová','Fialová','Sedláčková','Doležalová','Zemanová']},
 'Switzerland':{f:['Lena','Mia','Sophie','Lara','Nora','Elin','Alina','Jana','Nina','Sara','Lea','Livia','Zoe','Anna','Nadia'],
   l:['Meier','Keller','Müller','Huber','Baumann','Steiner','Brunner','Widmer','Frei','Kälin','Fischer','Marti','Roth','Graf','Suter']},
};
function buildTestTeams(){
  const out={};
  for(const nation in TEST_POOLS){
    const {f,l}=TEST_POOLS[nation];
    out[nation]={name:nation,players:TEST_NUMS.map((num,i)=>({id:uid(),num:String(num),name:f[i]+' '+l[i]}))};
  }
  return out;
}
function loadTestTeams(){
  // remove placeholder nations from an earlier version that aren't in this tournament
  ['Germany','Austria','Great Britain','France','Italy'].forEach(n=>{ if(teams[n]) delete teams[n]; });
  const t=buildTestTeams(); for(const k in t){ if(!teams[k]) teams[k]=t[k]; } persist();
}

/* ---- Nations Cup Prague 2026 — group stage schedule (from Tournify) ---- */
const NC_SCHEDULE=[
 // Friday 21 August 2026
 ['Fri 21.8','10:00','Field 1','Sweden','Ukraine'],
 ['Fri 21.8','10:00','Field 2','Ireland','Czechia'],
 ['Fri 21.8','11:15','Field 1','Finland','Switzerland'],
 ['Fri 21.8','11:15','Field 2','Ukraine','Poland'],
 ['Fri 21.8','12:30','Field 1','Sweden','Czechia'],
 ['Fri 21.8','12:30','Field 2','Ireland','Switzerland'],
 ['Fri 21.8','13:45','Field 1','Finland','Poland'],
 ['Fri 21.8','13:45','Field 2','Ireland','Ukraine'],
 ['Fri 21.8','15:00','Field 1','Switzerland','Poland'],
 ['Fri 21.8','15:00','Field 2','Finland','Sweden'],
 // Saturday 22 August 2026
 ['Sat 22.8','09:00','Field 1','Czechia','Ukraine'],
 ['Sat 22.8','09:00','Field 2','Poland','Sweden'],
 ['Sat 22.8','10:15','Field 1','Ukraine','Finland'],
 ['Sat 22.8','10:15','Field 2','Czechia','Switzerland'],
 ['Sat 22.8','11:30','Field 1','Switzerland','Sweden'],
 ['Sat 22.8','11:30','Field 2','Ireland','Poland'],
 ['Sat 22.8','13:45','Field 1','Czechia','Finland'],
 ['Sat 22.8','13:45','Field 2','Ireland','Sweden'],
 ['Sat 22.8','15:00','Field 1','Ukraine','Switzerland'],
 ['Sat 22.8','15:00','Field 2','Poland','Czechia'],
 ['Sat 22.8','16:15','Field 2','Ireland','Finland'],
];
// Sunday 23 August (bracket — teams depend on group standings, create these as results come in):
// 09:00 F1 QF2: 4th v 5th · 09:00 F2 QF3: 2nd v 7th · 10:15 F1 QF4: 3rd v 6th (1st seed bye = "Winner QF1")
// 10:15 F2 RR5-7: L QF2 v L QF3 · 11:30 F1 SF1: W QF1 v W QF2 · 11:30 F2 SF2: W QF3 v W QF4
// 12:45 F2 RR5-7: L QF3 v L QF4 · 14:00 F1 3rd place: L SF1 v L SF2 · 14:00 F2 RR5-7: L QF4 v L QF2
// 15:15 F1 Final: W SF1 v W SF2
function loadSchedule(){
  loadTestTeams(); // make sure all seven teams exist
  const clone=(n)=>({name:n,players:teams[n].players.map(p=>({...p}))});
  let added=0;
  NC_SCHEDULE.forEach(([day,time,field,hn,an])=>{
    const label=`${day} ${time} · ${field}`;
    if(games.some(g=>g.name===label)) return; // don't duplicate
    games.push({id:uid(),name:label,date:Date.now(),settings:defaultSettings(),
      teams:{home:clone(hn),away:clone(an)},plays:[]});
    added++;
  });
  persist();
  return added;
}

/* ============================================================
   GAME LOGIC (event-sourced, tested separately)
   ============================================================ */
function defaultSettings(){return{fieldLength:50,midfield:25,downsPerSeries:4,startYardLine:5};}
function deriveState(plays,s){
  let home=0,away=0,possession='home',spot=s.startYardLine,down=1;
  let seriesCrossedMid=false,awaitingPAT=false,patTeam=null;
  const add=(t,n)=>{t==='home'?home+=n:away+=n;};
  const flip=(end)=>{possession=possession==='home'?'away':'home';spot=Math.max(0,Math.min(s.fieldLength,s.fieldLength-end));down=1;seriesCrossedMid=false;};
  const newPoss=()=>{possession=possession==='home'?'away':'home';spot=s.startYardLine;down=1;seriesCrossedMid=false;};
  for(const p of plays){
    if(p.type==='pat'){ if(awaitingPAT&&patTeam&&p.pat&&p.pat.good) add(patTeam,p.pat.type==='2'?2:1);
      if(awaitingPAT){ awaitingPAT=false; newPoss(); } continue; }
    if(p.type==='safety'){ add(possession==='home'?'away':'home',2); newPoss(); continue; }
    if(p.type==='adjust'){
      if(p.setPossession) possession=p.setPossession;
      if(typeof p.setSpot==='number') spot=Math.max(0,Math.min(s.fieldLength,p.setSpot));
      if(typeof p.setDown==='number') down=Math.max(1,Math.min(s.downsPerSeries,p.setDown));
      seriesCrossedMid=(typeof p.setCrossedMid==='boolean')?p.setCrossedMid:(spot>=s.midfield);
      if(p.addHome) home+=p.addHome; if(p.addAway) away+=p.addAway;
      awaitingPAT=false; patTeam=null; continue;
    }
    if(p.type==='penalty'){ const y=p.penalty.yards||0;
      if(p.penalty.on==='def'){ const half=(s.fieldLength-spot)/2; spot=spot+Math.min(y,half); }
      else { const half=spot/2; spot=spot-Math.min(y,half); }
      spot=Math.max(0,Math.min(s.fieldLength,Math.round(spot)));
      // Crossing the midline via penalty earns the fresh set of downs — but only once
      // per series: being pushed back behind midline does NOT reset it.
      if(!seriesCrossedMid && spot>=s.midfield){ seriesCrossedMid=true; down=1; }
      if(p.penalty.autoFirst) down=1;
      if(p.penalty.lossOfDown){ down+=1; if(down>s.downsPerSeries) flip(spot); }
      continue; }
    const start=(typeof p.startSpot==='number')?p.startSpot:spot;
    let end=(typeof p.endSpot==='number')?p.endSpot:start;
    if(p.interception){ possession=possession==='home'?'away':'home';
      spot=Math.max(0,Math.min(s.fieldLength,p.intReturnEndSpot!=null?p.intReturnEndSpot:s.fieldLength-start));
      down=1; seriesCrossedMid=spot>=s.midfield; continue; }
    if(p.touchdown||end>=s.fieldLength){ add(possession,6); awaitingPAT=true; patTeam=possession; continue; }
    spot=Math.max(0,Math.min(s.fieldLength,end));
    if(!seriesCrossedMid&&spot>=s.midfield){ seriesCrossedMid=true; down=1; }
    else{ down+=1; if(down>s.downsPerSeries) flip(spot); }
  }
  const target=seriesCrossedMid?s.fieldLength:s.midfield;
  return{home,away,possession,spot,down,seriesCrossedMid,target,distance:Math.max(0,target-spot),awaitingPAT,patTeam};
}

/* ============================================================
   STATS (box score) computed from plays
   ============================================================ */
function blankLine(){return{att:0,comp:0,passYds:0,passTD:0,int:0,tgt:0,rec:0,recYds:0,recTD:0,drops:0,
  rushAtt:0,rushYds:0,rushTD:0,flags:0,tfl:0,sacks:0,pbu:0,defint:0,intRetYds:0,missedFlags:0,
  convThrow:0,convMade:0,convPts:0};}
function computeStats(game){
  const S=game.settings;
  const stats={home:{},away:{}};
  const ensure=(side,pid)=>{ if(!pid) return null; if(!stats[side][pid]) stats[side][pid]=blankLine(); return stats[side][pid]; };
  let possession='home';
  // replay possession to know offense/defense per play
  const st0=()=>{};
  let sim=[];
  for(const p of game.plays){
    const cur=deriveState(sim,S); possession=cur.possession;
    const off=possession, def=possession==='home'?'away':'home';
    const gain=(typeof p.endSpot==='number'&&typeof p.startSpot==='number')?(p.endSpot-p.startSpot):0;
    if(p.type==='pass'){
      const qb=ensure(off,p.passer);
      if(qb){ qb.att++; }
      const rec=ensure(off,p.receiver);
      if(p.receiver&&rec){ rec.tgt++; }
      if(p.interception){ if(qb) qb.int++; const d=ensure(def,p.interceptedBy); if(d){d.defint++; d.intRetYds+=(p.intReturnYds||0);} }
      else if(p.complete){ if(qb){qb.comp++; qb.passYds+=gain;} if(rec){rec.rec++; rec.recYds+=gain;}
        if(p.touchdown){ if(qb)qb.passTD++; if(rec)rec.recTD++; } }
      else { // incomplete
        if(p.incompleteReason==='drop'&&rec) rec.drops++;
        if(p.incompleteReason==='defended'){ const d=ensure(def,p.defendedBy); if(d)d.pbu++; }
      }
    } else if(p.type==='run'){
      const r=ensure(off,p.rusher); if(r){ r.rushAtt++; r.rushYds+=gain; if(p.touchdown)r.rushTD++; }
    } else if(p.type==='sack'){
      const d=ensure(def,p.sackBy); if(d){ d.sacks++; d.flags++; d.tfl++; }
    } else if(p.type==='pat'){
      if(cur.awaitingPAT && p.pat && p.pat.good){
        const pts=p.pat.type==='2'?2:1;
        if(p.pat.via==='pass'){ const qb=ensure(off,p.passer); if(qb)qb.convThrow++;
          const rc=ensure(off,p.receiver); if(rc){ rc.convMade++; rc.convPts+=pts; } }
        else if(p.pat.via==='run'){ const r=ensure(off,p.rusher); if(r){ r.convMade++; r.convPts+=pts; } }
      }
    }
    // flag pull credited on a stop short of the end zone; a TD instead records a missed flag
    if((p.type==='run'||(p.type==='pass'&&p.complete))&&!p.touchdown&&p.flagPullBy){
      const d=ensure(def,p.flagPullBy); if(d){ d.flags++; if(gain<0)d.tfl++; }
    }
    if((p.type==='run'||(p.type==='pass'&&p.complete))&&p.touchdown&&p.missedFlagBy){
      const d=ensure(def,p.missedFlagBy); if(d){ d.missedFlags++; }
    }
    sim.push(p);
  }
  return stats;
}
function teamTotals(game){
  const S=game.settings; let sim=[]; const t={home:{yds:0,passYds:0,rushYds:0,to:0,pen:0,firstDowns:0},away:{yds:0,passYds:0,rushYds:0,to:0,pen:0,firstDowns:0}};
  for(const p of game.plays){
    const cur=deriveState(sim,S); const off=cur.possession;
    const gain=(typeof p.endSpot==='number'&&typeof p.startSpot==='number')?(p.endSpot-p.startSpot):0;
    if(p.type==='pass'){ if(p.interception) t[off].to++; else if(p.complete){t[off].yds+=gain;t[off].passYds+=gain;} }
    else if(p.type==='run'){ t[off].yds+=gain; t[off].rushYds+=gain; }
    else if(p.type==='penalty') t[off].pen++;
    sim.push(p);
  }
  return t;
}

/* ============================================================
   ACTIVE GAME + LOGGING STATE MACHINE
   ============================================================ */
let ui={ step:'idle', pending:null }; // pending play under construction
function activeGame(){ return games.find(g=>g.id===activeId)||null; }
function rosterOf(game,side){ const t=game.teams[side]; return t&&t.players?t.players:[]; }
function playerName(game,side,pid){ const p=rosterOf(game,side).find(x=>x.id===pid); return p?('#'+p.num+' '+p.name):'#?'; }

function newPending(game){
  const st=deriveState(game.plays,game.settings);
  return { startSpot:st.spot, offense:st.possession, down:st.down,
    endSpot:null, type:null, passer:null, receiver:null, rusher:null,
    complete:null, incompleteReason:null, touchdown:false,
    interception:false, interceptedBy:null, intReturnEndSpot:null, intReturnYds:0,
    flagPullBy:null, missedFlagBy:null, defendedBy:null, sackBy:null, penalty:null, pat:null };
}
/* ---- Game clock (optional, counts DOWN) ---- */
function halfSeconds(){ return (prefs.halfMin||20)*60; }
function ensureClock(g){ if(!g.clock) g.clock={half:1,elapsed:0,running:false,startedAt:0};
  if(!g.clock.halfLen) g.clock.halfLen=halfSeconds(); return g.clock; }
function setHalfMin(min){ prefs.halfMin=Math.max(5,Math.min(30,min)); store.save('fs_prefs',prefs);
  // apply to every clock that hasn't been used yet
  games.forEach(g=>{ if(g.clock && !g.clock.running && g.clock.elapsed===0) g.clock.halfLen=halfSeconds(); });
  persist(); render(); }
function clockElapsed(g){ const c=ensureClock(g); return c.running ? c.elapsed+Math.floor((Date.now()-c.startedAt)/1000) : c.elapsed; }
function clockNow(g){ const c=ensureClock(g); return Math.max(0, c.halfLen-clockElapsed(g)); } // remaining
function clockToggle(g){ const c=ensureClock(g);
  if(c.running){ c.elapsed=clockElapsed(g); c.running=false; }
  else { if(clockNow(g)<=0){ return; } c.startedAt=Date.now(); c.running=true; }
  persist(); render(); }
function clockSetHalf(g,hf){ const c=ensureClock(g);
  if(c.half===hf) return;
  c.elapsed=0; c.running=false; c.half=hf; persist(); render(); }
function clockEdit(g){ const c=ensureClock(g);
  showModal({title:'Set clock',body:'Time remaining in this half (sync with the official clock).',
    inputs:[{key:'t',label:'mm:ss',value:fmtClock(clockNow(g)),numeric:true}],
    buttons:[
      {label:'Set',cls:'green',onTap:(v)=>{
        const m=String(v.t||'').trim().match(/^(\d{1,2})[:.](\d{1,2})$/);
        if(!m){ toast('Use mm:ss'); return; }
        const rem=Math.min(c.halfLen,(+m[1])*60+(+m[2]));
        c.elapsed=c.halfLen-rem; if(c.running) c.startedAt=Date.now();
        persist(); render(); }},
      {label:'Cancel'}
    ]});
}
function fmtClock(sec){ const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
let clockTimer=setInterval(()=>{ const g=activeGame&&activeGame(); if(g&&g.clock&&g.clock.running){
  const rem=clockNow(g);
  const el=document.getElementById('clockTime'); if(el) el.textContent=fmtClock(rem);
  if(rem<=0){ const c=g.clock; c.elapsed=c.halfLen; c.running=false; persist(); render(); toast('End of half'); } } },1000);

/* ---- Wake lock: keep the screen on while logging ---- */
let wakeLock=null;
async function ensureWakeLock(){
  try{ if('wakeLock' in navigator && !wakeLock){
    wakeLock=await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release',()=>{ wakeLock=null; });
  }}catch(e){ wakeLock=null; }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') ensureWakeLock(); });

function commit(){ const g=activeGame(); if(!g||!ui.pending) return;
  ui.pending.ts=Date.now();
  if(prefs.clock){ const c=ensureClock(g); ui.pending.half=c.half; ui.pending.clock=clockNow(g); }
  g.plays.push(ui.pending); ui.pending=null; ui.step='idle'; persist(); render(); toast('Play saved'); }
function undo(){ const g=activeGame(); if(!g) return;
  if(ui.pending){ ui.pending=null; ui.step='idle'; render(); return; }
  if(g.plays.length){ g.plays.pop(); persist(); toast('Undid last play'); }
  render(); }

// Manual correction of the game situation (for missed plays / possession changes).
function enterAdjust(g){
  if(ui.pending){ ui.pending=null; }
  const st=deriveState(g.plays,g.settings);
  ui.adjust={ possession:st.possession, spot:st.spot, down:st.down, home:st.home, away:st.away, base:st };
  ui.step='adjust'; render();
}
function applyAdjust(){ const g=activeGame(); if(!g||!ui.adjust) return; const a=ui.adjust, S=g.settings;
  g.plays.push({ type:'adjust', ts:Date.now(),
    setPossession:a.possession, setSpot:a.spot, setDown:a.down,
    setCrossedMid:a.spot>=S.midfield,
    addHome:a.home-a.base.home, addAway:a.away-a.base.away });
  ui.adjust=null; ui.step='idle'; persist(); render(); toast('Situation updated'); }
function cancelAdjust(){ ui.adjust=null; ui.step='idle'; render(); }

/* ============================================================
   RENDER: LIVE GAME
   ============================================================ */
function h(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderGame(){
  const root=document.getElementById('view-game');
  const g=activeGame();

    ct.onclick=()=>clockEdit(g);

    ]});

function deriveStateWithPending(g){
  // preview state including the pending play's endSpot for the gain tag
  return deriveState(g.plays,g.settings);
}
function ballText(g,spot,posSide){
  const S=g.settings, mid=S.midfield;
  // express as "own X" / "opp X" from possessing team perspective
  if(spot<=mid){ return 'Own '+spot; }
  return 'Opp '+(S.fieldLength-spot);
}

function buildField(g,st,posSide){
  const S=g.settings, L=S.fieldLength;
  const f=h(`<div class="field" id="fieldEl"></div>`);
  // end zones: top = attacking (opp goal), bottom = own goal
  f.appendChild(h(`<div class="ez top"><span>OPP GOAL</span></div>`));
  f.appendChild(h(`<div class="ez bot"><span>OWN GOAL</span></div>`));
  // playing area between 9% and 91%
  const top=9, bot=91, span=bot-top;
  const yToPct=(yard)=>{ // yard 0=own goal(bottom) .. L=opp goal(top)
    return bot - (yard/L)*span; };
  // ticks every 5 yards + midfield
  for(let y=5;y<L;y+=5){
    const pct=yToPct(y);
    const tick=h(`<div class="ytick ${y===S.midfield?'mid':''}"></div>`);
    tick.style.top=pct+'%'; f.appendChild(tick);
    const nm=h(`<div class="ynum">${y<=S.midfield?y:(L-y)}</div>`);
    nm.style.top=pct+'%'; f.appendChild(nm);
  }
  // committed ball (or the working spot while correcting the situation)
  const isAdjust=()=> ui.step==='adjust' && ui.adjust;
  const cur=deriveState(g.plays,S);
  const ballSpot = isAdjust()? ui.adjust.spot : cur.spot;
  const ball=h(`<div class="ball"></div>`); ball.style.top=yToPct(ballSpot)+'%'; f.appendChild(ball);
  // persistent pending marker + gain tag (shown during drag / after set)
  const pmark=h(`<div class="pending" style="display:none"></div>`); f.appendChild(pmark);
  const ptag=h(`<div class="gainTag" style="display:none"></div>`); f.appendChild(ptag);
  const isSpotStep=()=> ui.pending && ['run_spot','pass_spot','sack_spot','int_spot'].includes(ui.step);
  const isInt=()=> ui.step==='int_spot';
  function showAt(yard){
    const pct=yToPct(yard);
    pmark.style.display='block'; pmark.style.top=pct+'%';
    let txt;
    if(isInt()){ const catchAt=L-ui.pending.startSpot; const ret=Math.max(0,yard-catchAt); txt='ret '+ret+' yd'; }
    else { const gain=yard-ui.pending.startSpot; txt=(gain>=0?'+':'')+gain+' yd'+(yard>=L?' · TD':''); }
    ptag.style.display='block'; ptag.textContent=txt; ptag.style.top='calc('+pct+'% - 16px)';
    const rv=document.getElementById('posReadoutVal'), rg=document.getElementById('posReadoutGain');
    if(rv&&rg){
      if(isInt()){ const catchAt=L-ui.pending.startSpot; rv.textContent=posLabel(g,yard); rg.textContent='return '+Math.max(0,yard-catchAt)+' yd'; }
      else { const gain=yard-ui.pending.startSpot; rv.textContent=yard>=L?'Touchdown':posLabel(g,yard); rg.textContent=(gain>=0?'+':'')+gain+' yd'; }
    }
  }
  function showAdjust(yard){
    ball.style.top=yToPct(yard)+'%';
    const rv=document.getElementById('posReadoutVal'); if(rv) rv.textContent=posLabel(g,yard);
  }
  // restore marker if a spot is already chosen
  if(ui.pending){
    if(isInt() && ui.pending.intReturnEndSpot!=null) showAt(ui.pending.intReturnEndSpot);
    else if(!isInt() && ui.pending.endSpot!=null) showAt(ui.pending.endSpot);
  }
  const yardFrom=(clientY)=>{ const rect=f.getBoundingClientRect();
    const pctY=((clientY-rect.top)/rect.height)*100;
    let yard=((bot-pctY)/span)*L; return Math.max(0,Math.min(L,Math.round(yard))); };
  let dragging=false;
  const active=()=> (isSpotStep()||isAdjust()) && inputMode==='field';
  const paint=(yard)=>{ if(isAdjust()){ ui.adjust.spot=yard; showAdjust(yard); } else showAt(yard); };
  const begin=(cy,e)=>{ if(!active())return; dragging=true; if(e&&e.pointerId!=null){try{f.setPointerCapture(e.pointerId);}catch(_){}} paint(yardFrom(cy)); };
  const move =(cy)=>{ if(!dragging)return; paint(yardFrom(cy)); };
  const end  =(cy)=>{ if(!dragging)return; dragging=false; const y=yardFrom(cy);
    if(isAdjust()){ ui.adjust.spot=y; render(); return; }
    if(isInt()){ ui.pending.intReturnEndSpot=y;
      ui.pending.intReturnYds=Math.max(0,y-(L-ui.pending.startSpot)); }
    else { ui.pending.endSpot=y; ui.pending.touchdown = y>=L; }
    if(prefs.spotter){ commit(); return; }
    render(); };
  f.addEventListener('pointerdown',e=>{ begin(e.clientY,e); });
  f.addEventListener('pointermove', e=>{ move(e.clientY); });
  f.addEventListener('pointerup',   e=>{ end(e.clientY); });
  f.addEventListener('pointercancel',()=>{ dragging=false; });
  // plain click fallback (older browsers without pointer events)
  if(!window.PointerEvent){
    f.onclick=(e)=>{ if(!active())return; const y=yardFrom(e.clientY);
      if(isAdjust()){ ui.adjust.spot=y; }
      else if(isInt()) ui.pending.intReturnEndSpot=y; else { ui.pending.endSpot=y; ui.pending.touchdown=y>=L; } render(); };
  }
  return f;
}

/* ---- the step panel ---- */
function buildPanel(g,st){
  const wrap=h(`<div></div>`);
  const S=g.settings;
  const posSide=st.possession, defSide=posSide==='home'?'away':'home';
  const off=rosterOf(g,posSide), def=rosterOf(g,defSide);
  const setPrompt=(t,sub)=>wrap.appendChild(h(`<div><div class="prompt">${esc(t)}</div>${sub?`<div class="promptSub">${esc(sub)}</div>`:''}</div>`));

  const grid=(cls)=>{const el=h(`<div class="btnGrid ${cls||''}"></div>`);return el;};
  const B=(txt,cls,fn)=>{const b=h(`<button class="btn ${cls||''}">${txt}</button>`);b.onclick=fn;return b;};

  // ---- Fix the situation (manual correction after missed plays) ----
  if(ui.step==='adjust' && ui.adjust){
    const a=ui.adjust, L=S.fieldLength;
    setPrompt('Fix the situation','Correct possession, ball, down or score after a missed play');
    // possession
    wrap.appendChild(h(`<div class="lbl" style="margin:10px 0 6px">Who has the ball?</div>`));
    const pg=grid('c2');
    ['home','away'].forEach(sd=>{ pg.appendChild(B(esc(g.teams[sd].name),a.possession===sd?'amber':'ghost',()=>{
      if(a.possession!==sd){ a.possession=sd; a.spot=L-a.spot; } render(); })); });
    wrap.appendChild(pg);
    // ball position — field (tap/drag) or numeric steppers
    wrap.appendChild(modeToggle());
    wrap.appendChild(h(`<div class="readout" id="posReadout" style="margin-top:2px">
      <div class="lbl">${inputMode==='field'?'Ball on — tap or drag the field':'Ball on'}</div>
      <div class="rv" id="posReadoutVal">${esc(posLabel(g,a.spot))}</div></div>`));
    if(inputMode==='numeric'){
      const setSpot=(v)=>{ a.spot=Math.max(0,Math.min(L,Math.round(v))); render(); };
      const mkRow=(pairs)=>{ const r=grid('c3'); r.style.marginBottom='8px';
        pairs.forEach(([d,l])=>r.appendChild(B(l,'ghost sm',()=>setSpot(a.spot+d)))); return r; };
      wrap.appendChild(mkRow([[-10,'−10'],[-5,'−5'],[-1,'−1']]));
      wrap.appendChild(mkRow([[1,'+1'],[5,'+5'],[10,'+10']]));
    }
    // down
    wrap.appendChild(h(`<div class="lbl" style="margin:4px 0 6px">Down</div>`));
    const dg=grid('c4');
    [1,2,3,4].forEach(d=>dg.appendChild(B(String(d),a.down===d?'amber':'ghost',()=>{a.down=d;render();})));
    wrap.appendChild(dg);
    // score
    wrap.appendChild(h(`<div class="lbl" style="margin:10px 0 6px">Score</div>`));
    ['home','away'].forEach(sd=>{
      const row=h(`<div class="rowline" style="align-items:center"></div>`);
      row.appendChild(h(`<div style="flex:1;font-weight:700">${esc(g.teams[sd].name)}</div>`));
      const minus=h(`<button class="btn sm ghost" style="width:44px">−</button>`); minus.onclick=()=>{a[sd]=Math.max(0,a[sd]-1);render();};
      const val=h(`<div class="num" style="width:44px;text-align:center;font-size:20px;font-weight:800">${a[sd]}</div>`);
      const plus=h(`<button class="btn sm ghost" style="width:44px">+</button>`); plus.onclick=()=>{a[sd]=a[sd]+1;render();};
      row.appendChild(minus);row.appendChild(val);row.appendChild(plus);
      wrap.appendChild(row);
    });
    const bar=h(`<div class="barRow" style="margin-top:12px"></div>`);
    bar.appendChild(B('Apply','green sm',applyAdjust));
    bar.appendChild(B('Cancel','ghost sm',cancelAdjust));
    wrap.appendChild(bar);
    return wrap;
  }

  // ---- Point-after / conversion flow (attributable) ----
  const inPAT = st.awaitingPAT || (ui.pending && ui.pending.type==='pat');
  if(inPAT){
    const teamName=g.teams[st.patTeam||posSide].name;
    if(ui.step==='idle'){
      if(prefs.spotter){
        setPrompt('Point after — '+teamName,'1-pt from the 5 · 2-pt from the 10');
        const gr=grid('c2');
        gr.appendChild(B('1-PT Good','green',()=>{startPending(g);ui.pending.type='pat';ui.pending.pat={type:'1',good:true};commit();}));
        gr.appendChild(B('1-PT No','ghost',()=>{startPending(g);ui.pending.type='pat';ui.pending.pat={type:'1',good:false};commit();}));
        gr.appendChild(B('2-PT Good','green',()=>{startPending(g);ui.pending.type='pat';ui.pending.pat={type:'2',good:true};commit();}));
        gr.appendChild(B('2-PT No','ghost',()=>{startPending(g);ui.pending.type='pat';ui.pending.pat={type:'2',good:false};commit();}));
        wrap.appendChild(gr);
        return wrap;
      }
      setPrompt('Point after — '+teamName,'Pick the value, then who made the play');
      const gr=grid('c2');
      gr.appendChild(B('1-PT (from 5)','green',()=>{startPending(g);ui.pending.type='pat';ui.pending.pat={type:'1'};ui.pending.passer=defaultQB(g,posSide);ui.step='pat_play';render();}));
      gr.appendChild(B('2-PT (from 10)','blue',()=>{startPending(g);ui.pending.type='pat';ui.pending.pat={type:'2'};ui.pending.passer=defaultQB(g,posSide);ui.step='pat_play';render();}));
      wrap.appendChild(gr);
      const q=grid('c2'); q.style.marginTop='8px';
      q.appendChild(B('Quick: 1-pt good','ghost sm',()=>{startPending(g);ui.pending.type='pat';ui.pending.pat={type:'1',good:true};commit();}));
      q.appendChild(B('Quick: 2-pt good','ghost sm',()=>{startPending(g);ui.pending.type='pat';ui.pending.pat={type:'2',good:true};commit();}));
      wrap.appendChild(q);
      return wrap;
    }
    if(ui.step==='pat_play'){
      setPrompt(ui.pending.pat.type+'-pt attempt — how?','Pass or run into the end zone');
      const gr=grid('c2');
      gr.appendChild(B('Pass','green',()=>{ui.pending.pat.via='pass';ui.step='pat_pass_rec';render();}));
      gr.appendChild(B('Run','blue',()=>{ui.pending.pat.via='run';ui.step='pat_run';render();}));
      wrap.appendChild(gr);
      wrap.appendChild(h(`<div class="lbl" style="margin:10px 0 6px">Passer (for pass): ${esc(playerName(g,posSide,ui.pending.passer))}</div>`));
      wrap.appendChild(playerPicker(off,ui.pending.passer,pid=>{ui.pending.passer=pid;render();},true));
      return wrap;
    }
    if(ui.step==='pat_pass_rec'){
      setPrompt('Target on the conversion?','Then mark good or no good');
      wrap.appendChild(playerPicker(off,ui.pending.receiver,pid=>{ui.pending.receiver=pid;ui.step='pat_result';render();}));
      return wrap;
    }
    if(ui.step==='pat_run'){
      setPrompt('Ball carrier on the conversion?');
      wrap.appendChild(playerPicker(off,ui.pending.rusher,pid=>{ui.pending.rusher=pid;ui.step='pat_result';render();}));
      return wrap;
    }
    if(ui.step==='pat_result'){
      const who = ui.pending.pat.via==='pass'
        ? playerName(g,posSide,ui.pending.passer)+' → '+playerName(g,posSide,ui.pending.receiver)
        : playerName(g,posSide,ui.pending.rusher);
      setPrompt(ui.pending.pat.type+'-pt: '+who,'Did it convert?');
      const gr=grid('c2');
      gr.appendChild(B('Good','green',()=>{ui.pending.pat.good=true;commit();}));
      gr.appendChild(B('No good','red',()=>{ui.pending.pat.good=false;commit();}));
      wrap.appendChild(gr);
      wrap.appendChild(h(`<div class="barRow" style="margin-top:8px"></div>`)).appendChild(
        (()=>{const b=h(`<button class="btn ghost sm">Back</button>`);b.onclick=()=>{ui.step='pat_play';render();};return b;})());
      return wrap;
    }
  }

  // Shared renderer for a "set the spot" step — works in Field or Numbers mode.
  const spotUI=(opts)=>{
    const isInt=!!opts.isInt, allowTD=!!opts.allowTD, withDefender=!!opts.withDefender && !prefs.spotter;
    const L=g.settings.fieldLength;
    const val=()=> isInt?ui.pending.intReturnEndSpot:ui.pending.endSpot;
    if(inputMode==='numeric' && val()==null){
      if(isInt) ui.pending.intReturnEndSpot=L-ui.pending.startSpot; else ui.pending.endSpot=ui.pending.startSpot;
    }
    wrap.appendChild(modeToggle());
    wrap.appendChild(spotReadout(g));
    const td=ui.pending.touchdown;
    if(inputMode==='numeric'){
      setPrompt(isInt?'Set the return, then save':(td?'Touchdown — optional missed flag':'Set yards gained, then save'),
                isInt?'Adjust with the buttons':'+ downfield · − for a loss');
      wrap.appendChild(yardChips(g,isInt));
    } else {
      const empty=val()==null;
      setPrompt(empty?(isInt?'Drag or tap where the return ended':'Drag or tap the field to set the spot')
                     :(isInt?'Return recorded':(td?'Touchdown — optional missed flag':'Optional: who pulled the flag?')),
                empty?'The yard line shows beside the field':(isInt?'Shown from the intercepting side':'Or just save'));
    }
    if(val()!=null){
      if(isInt){ const catchAt=L-ui.pending.startSpot; ui.pending.intReturnYds=Math.max(0,ui.pending.intReturnEndSpot-catchAt); }
      if(withDefender) wrap.appendChild(defenderRow(g,defSide));
      wrap.appendChild(saveRow(g,allowTD));
    }
  };

  switch(ui.step){
    case 'idle':{
      setPrompt(g.teams[posSide].name+' ball','Pick the play type');
      const gr=grid('c2');
      gr.appendChild(B('PASS','green big',()=>{startPending(g);ui.pending.type='pass';ui.pending.passer=defaultQB(g,posSide);ui.step='pass_out';render();}));
      gr.appendChild(B('RUN','blue big',()=>{startPending(g);ui.pending.type='run';ui.step='run_rusher';render();}));
      wrap.appendChild(gr);
      const gr2=grid('c3'); gr2.style.marginTop='8px';
      gr2.appendChild(B('Sack','sm',()=>{startPending(g);ui.pending.type='sack';ui.step='sack_def';render();}));
      gr2.appendChild(B('Penalty','sm',()=>{startPending(g);ui.pending.type='penalty';ui.step='penalty';render();}));
      gr2.appendChild(B('Other','sm',()=>{ui.step='other';render();}));
      wrap.appendChild(gr2);
      break;
    }
    case 'other':{
      setPrompt('Other events');
      const gr=grid('c2');
      gr.appendChild(B('Safety','red',()=>{startPending(g);ui.pending.type='safety';commit();}));
      gr.appendChild(B('Back','ghost',()=>{ui.step='idle';render();}));
      wrap.appendChild(gr);
      break;
    }
    case 'pass_out':{
      setPrompt('Passer: '+playerName(g,posSide,ui.pending.passer),'Tap to change · then the result');
      wrap.appendChild(playerPicker(off,ui.pending.passer,pid=>{ui.pending.passer=pid;render();},true));
      const gr=grid('c3'); gr.style.marginTop='10px';
      gr.appendChild(B('Complete','green',()=>{ui.pending.complete=true;ui.step='pass_rec';render();}));
      gr.appendChild(B('Incomplete','ghost',()=>{ui.pending.complete=false; if(prefs.spotter){commit();return;} ui.step='pass_inc';render();}));
      gr.appendChild(B('Intercept','red',()=>{ui.pending.complete=false;ui.pending.interception=true;ui.step='int_def';render();}));
      wrap.appendChild(gr);
      break;
    }
    case 'pass_rec':{
      setPrompt('Caught by?','Then tap the field where the play ended');
      wrap.appendChild(playerPicker(off,ui.pending.receiver,pid=>{ui.pending.receiver=pid;ui.step='pass_spot';render();}));
      break;
    }
    case 'pass_spot':{ spotUI({allowTD:true,withDefender:true}); break; }
    case 'pass_inc':{
      setPrompt('Incomplete — why?','Helps track drops & pass breakups');
      const gr=grid('c3');
      gr.appendChild(B('Drop','ghost',()=>{ui.pending.incompleteReason='drop';commit();}));
      gr.appendChild(B('Defended','ghost',()=>{ui.pending.incompleteReason='defended';ui.step='pbu_def';render();}));
      gr.appendChild(B('Overthrow','ghost',()=>{ui.pending.incompleteReason='overthrow';commit();}));
      wrap.appendChild(gr);
      break;
    }
    case 'pbu_def':{
      setPrompt('Broken up by?');
      wrap.appendChild(playerPicker(def,ui.pending.defendedBy,pid=>{ui.pending.defendedBy=pid;commit();}));
      break;
    }
    case 'int_def':{
      setPrompt('Intercepted by?','Then tap the field for the return spot');
      wrap.appendChild(playerPicker(def,ui.pending.interceptedBy,pid=>{ui.pending.interceptedBy=pid;ui.step='int_spot';render();}));
      break;
    }
    case 'int_spot':{ spotUI({isInt:true}); break; }
    case 'run_rusher':{
      setPrompt('Ball carrier?','Then tap the field where flags were pulled');
      wrap.appendChild(playerPicker(off,ui.pending.rusher,pid=>{ui.pending.rusher=pid;ui.step='run_spot';render();}));
      break;
    }
    case 'run_spot':{ spotUI({allowTD:true,withDefender:true}); break; }
    case 'sack_def':{
      setPrompt('Sack by?','Then tap the field for the loss spot');
      wrap.appendChild(playerPicker(def,ui.pending.sackBy,pid=>{ui.pending.sackBy=pid;ui.step='sack_spot';render();}));
      break;
    }
    case 'sack_spot':{ spotUI({}); break; }
    case 'penalty':{
      setPrompt('Penalty');
      const gr=grid('c2');
      const on={v:'def'};
      const bOff=B('On Offense','ghost',()=>{ui.pending.penalty={on:'off',yards:5,autoFirst:false};ui.step='penalty_yd';render();});
      const bDef=B('On Defense','ghost',()=>{ui.pending.penalty={on:'def',yards:5,autoFirst:false};ui.step='penalty_yd';render();});
      gr.appendChild(bOff);gr.appendChild(bDef);wrap.appendChild(gr);
      break;
    }
    case 'penalty_yd':{
      const isDef=ui.pending.penalty.on==='def';
      setPrompt('Penalty yards ('+(isDef?'defense':'offense')+')',
                'Half-the-distance applies near a goal line · crossing midline earns the new set');
      if(isDef){
        const af=ui.pending.penalty.autoFirst;
        const toggle=h(`<button class="btn sm ${af?'amber':'ghost'}" style="margin-bottom:8px;width:100%">${af?'✓ ':''}Automatic first down</button>`);
        toggle.onclick=()=>{ ui.pending.penalty.autoFirst=!ui.pending.penalty.autoFirst; render(); };
        wrap.appendChild(toggle);
      } else {
        const ld=ui.pending.penalty.lossOfDown;
        const toggle=h(`<button class="btn sm ${ld?'amber':'ghost'}" style="margin-bottom:8px;width:100%">${ld?'✓ ':''}Loss of down</button>`);
        toggle.onclick=()=>{ ui.pending.penalty.lossOfDown=!ui.pending.penalty.lossOfDown; render(); };
        wrap.appendChild(toggle);
      }
      const gr=grid('c2');
      [5,10,15].forEach(y=>gr.appendChild(B(y+' yards','ghost',()=>{ui.pending.penalty.yards=y;commit();})));
      gr.appendChild(B('Half distance','ghost',()=>{ui.pending.penalty.yards=g.settings.fieldLength;commit();}));
      wrap.appendChild(gr);
      break;
    }
    default: setPrompt('…');
  }
  return wrap;
}
function defaultQB(g,side){ // last passer used, else first player
  for(let i=g.plays.length-1;i>=0;i--){ const p=g.plays[i]; if(p.type==='pass'&&p.offense===side&&p.passer) return p.passer; }
  const r=rosterOf(g,side); return r.length?r[0].id:null;
}
function startPending(g){ ui.pending=newPending(g); }
function playerPicker(list,selId,onPick,noAdd){
  const el=h(`<div class="pGrid"></div>`);
  list.forEach(p=>{
    const chip=h(`<div class="pChip ${p.id===selId?'sel':''}"><div class="n num">${esc(p.num)}</div><div class="nm">${esc(p.name||'')}</div></div>`);
    chip.onclick=()=>onPick(p.id); el.appendChild(chip);
  });
  if(!noAdd){
    const add=h(`<div class="pChip add">+</div>`);
    add.onclick=()=>{
      showModal({title:'Add player',inputs:[
          {key:'num',label:'Jersey number',numeric:true},
          {key:'name',label:'Name (optional)'}],
        buttons:[
          {label:'Add',cls:'green',onTap:(v)=>{
            const num=String(v.num||'').trim(); if(!num){ toast('Number required'); return; }
            const g=activeGame();
            let target='home';
            if(g.teams.away.players===list) target='away'; else if(g.teams.home.players===list) target='home';
            const np={id:uid(),num,name:String(v.name||'').trim()};
            g.teams[target].players.push(np); persist(); onPick(np.id); }},
          {label:'Cancel'}
        ]});
    };
    el.appendChild(add);
  }
  return el;
}
function defenderRow(g,defSide){
  const td = ui.pending && ui.pending.touchdown;
  const wrap=h(`<div style="margin-top:8px"></div>`);
  wrap.appendChild(h(`<div class="lbl" style="margin-bottom:6px">${td?'Missed flag by (optional)':'Flag pull by (optional)'}</div>`));
  const field = td ? 'missedFlagBy' : 'flagPullBy';
  wrap.appendChild(playerPicker(rosterOf(g,defSide),ui.pending[field],pid=>{ui.pending[field]=pid;render();}));
  return wrap;
}
function posLabel(g,yard){ const L=g.settings.fieldLength, mid=g.settings.midfield;
  if(yard<=0) return 'Own goal'; if(yard>=L) return 'Goal line';
  if(yard===mid) return 'Midfield'; if(yard<mid) return 'Own '+yard; return 'Opp '+(L-yard); }
function modeToggle(){
  const wrap=h(`<div class="modeToggle"></div>`);
  const mk=(id,label)=>{ const b=h(`<button class="mt ${inputMode===id?'on':''}">${label}</button>`); b.onclick=()=>setInputMode(id); return b; };
  wrap.appendChild(mk('field','🏈 Field')); wrap.appendChild(mk('numeric','123 Numbers'));
  return wrap;
}
function yardChips(g,isInt){
  const L=g.settings.fieldLength;
  const wrap=h(`<div style="margin-top:8px"></div>`);
  const getV=()=> isInt?ui.pending.intReturnEndSpot:ui.pending.endSpot;
  const setV=(v)=>{ v=Math.max(0,Math.min(L,Math.round(v)));
    if(isInt) ui.pending.intReturnEndSpot=v; else { ui.pending.endSpot=v; ui.pending.touchdown=v>=L; } render(); };
  const mkRow=(pairs)=>{ const r=h(`<div class="btnGrid c3" style="margin-bottom:8px"></div>`);
    pairs.forEach(([d,l])=>{ const b=h(`<button class="btn sm ghost">${l}</button>`); b.onclick=()=>setV(getV()+d); r.appendChild(b); }); return r; };
  wrap.appendChild(mkRow([[-10,'−10'],[-5,'−5'],[-1,'−1']]));
  wrap.appendChild(mkRow([[1,'+1'],[5,'+5'],[10,'+10']]));
  if(!isInt){ const td=h(`<button class="btn sm amber" style="width:100%">Touchdown</button>`);
    td.onclick=()=>{ ui.pending.endSpot=L; ui.pending.touchdown=true; render(); }; wrap.appendChild(td); }
  return wrap;
}
function spotReadout(g){
  const wrap=h(`<div class="readout" id="posReadout"></div>`);
  const isInt = ui.step==='int_spot';
  const val = isInt ? ui.pending.intReturnEndSpot : ui.pending.endSpot;
  let posTxt='—', gainTxt='drag the field';
  if(val!=null){
    if(isInt){ const catchAt=g.settings.fieldLength-ui.pending.startSpot; posTxt=posLabel(g,val); gainTxt='return '+Math.max(0,val-catchAt)+' yd'; }
    else { const gn=val-ui.pending.startSpot; posTxt=val>=g.settings.fieldLength?'Touchdown':posLabel(g,val); gainTxt=(gn>=0?'+':'')+gn+' yd'; }
  }
  wrap.appendChild(h(`<div class="lbl">Ball on</div>`));
  wrap.appendChild(h(`<div class="rv" id="posReadoutVal">${esc(posTxt)}</div>`));
  wrap.appendChild(h(`<div class="rg" id="posReadoutGain">${esc(gainTxt)}</div>`));
  return wrap;
}
function saveRow(g,allowTD){
  const isTD = ui.pending && ui.pending.touchdown;
  const row=h(`<div class="barRow" style="margin-top:10px"></div>`);
  if(allowTD && !isTD){
    const td=h(`<button class="btn amber sm">Touchdown</button>`);
    td.onclick=()=>{ ui.pending.touchdown=true; ui.pending.endSpot=g.settings.fieldLength; render(); };
    row.appendChild(td);
  }
  const save=h(`<button class="btn green sm">${isTD?'Save touchdown':'Save play'}</button>`); save.onclick=commit;
  const cancel=h(`<button class="btn ghost sm">Cancel</button>`); cancel.onclick=()=>{ui.pending=null;ui.step='idle';render();};
  row.appendChild(save); row.appendChild(cancel);
  return row;
}

/* ---- box score ---- */
/* ---- Play-by-play log ---- */
function pName(g,side,pid){ if(!pid) return null; const p=rosterOf(g,side).find(x=>x.id===pid); return p?('#'+p.num):null; }
function describePlay(g,p,pre){
  const off=pre.possession, def=off==='home'?'away':'home';
  const offN=g.teams[off].name.slice(0,3).toUpperCase();
  const gain=(typeof p.endSpot==='number'&&typeof p.startSpot==='number')?(p.endSpot-p.startSpot):0;
  const yd=(n)=>((n>=0?'+':'')+n);
  let situ = pre.awaitingPAT ? `${offN} · PAT` : `${offN} · ${pre.down}${['st','nd','rd','th'][Math.min(pre.down,4)-1]} · ${posLabel(g,pre.spot)}`;
  if(prefs.clock && p.half) situ = `H${p.half} ${p.clock!=null?fmtClock(p.clock):''} · `+situ;
  let desc='', scoring=false;
  if(p.type==='pass'){
    const qb=pName(g,off,p.passer)||'QB';
    if(p.interception){ desc=`${qb} INTERCEPTED by ${pName(g,def,p.interceptedBy)||'?'}${p.intReturnYds?` · ret ${p.intReturnYds}`:''}`; scoring=true; }
    else if(p.complete){ desc=`${qb} → ${pName(g,off,p.receiver)||'?'} ${yd(gain)}${p.touchdown?' · TOUCHDOWN':''}${p.flagPullBy?` · flag ${pName(g,def,p.flagPullBy)}`:''}${p.missedFlagBy?` · missed ${pName(g,def,p.missedFlagBy)}`:''}`; scoring=p.touchdown; }
    else { desc=`${qb} incomplete${p.receiver?` (→ ${pName(g,off,p.receiver)})`:''}${p.incompleteReason?` · ${p.incompleteReason}`:''}${p.defendedBy?` by ${pName(g,def,p.defendedBy)}`:''}`; }
  }
  else if(p.type==='run'){ desc=`Run ${pName(g,off,p.rusher)||'?'} ${yd(gain)}${p.touchdown?' · TOUCHDOWN':''}${p.flagPullBy?` · flag ${pName(g,def,p.flagPullBy)}`:''}${p.missedFlagBy?` · missed ${pName(g,def,p.missedFlagBy)}`:''}`; scoring=p.touchdown; }
  else if(p.type==='sack'){ desc=`SACK by ${pName(g,def,p.sackBy)||'?'} ${yd(gain)}`; }
  else if(p.type==='pat'){ const who=p.pat.via==='pass'?`${pName(g,off,p.passer)||''} → ${pName(g,off,p.receiver)||''}`:(p.pat.via==='run'?pName(g,off,p.rusher)||'':'');
    desc=`${p.pat.type}-pt ${p.pat.good?'GOOD':'no good'}${who?` · ${who}`:''}`; scoring=p.pat.good; }
  else if(p.type==='penalty'){ desc=`Penalty on ${p.penalty.on==='def'?'defense':'offense'} · ${p.penalty.yards>=g.settings.fieldLength?'half distance':p.penalty.yards+' yd'}${p.penalty.autoFirst?' · auto 1st':''}${p.penalty.lossOfDown?' · loss of down':''}`; }
  else if(p.type==='safety'){ desc='SAFETY'; scoring=true; }
  else if(p.type==='adjust'){ desc='⚙ Situation corrected'; }
  return {situ,desc,scoring};
}
function deletePlay(g,idx){
  const p=g.plays[idx];
  const isTD=p&&(p.touchdown||((p.type==='pass'||p.type==='run')&&typeof p.endSpot==='number'&&p.endSpot>=g.settings.fieldLength));
  let n=1;
  if(isTD && g.plays[idx+1] && g.plays[idx+1].type==='pat') n=2; // remove the attached PAT too
  g.plays.splice(idx,n);
  ui.editIdx=null; persist(); render(); toast(n===2?'Play + PAT removed':'Play removed');
}
function buildPlayLog(g){

/* ---- Drive & efficiency analytics ---- */
function computeDrives(game){
  const S=game.settings;
  const mk=()=>({drives:0,points:0,startSum:0,fourthAtt:0,fourthConv:0,tos:0});
  const t={home:mk(),away:mk()};
  let sim=[], curOff=null;
  const openDrive=(off,spot)=>{ curOff=off; t[off].drives++; t[off].startSum+=spot; };
  game.plays.forEach((p)=>{
    const pre=deriveState(sim,S);
    if(p.type!=='adjust'){
      if(curOff===null && !pre.awaitingPAT) openDrive(pre.possession,pre.spot);
      else if(curOff!==null && pre.possession!==curOff && !pre.awaitingPAT) openDrive(pre.possession,pre.spot);
      if(!pre.awaitingPAT && pre.down===S.downsPerSeries && ['pass','run','sack'].includes(p.type)){
        t[pre.possession].fourthAtt++;
        const post=deriveState([...sim,p],S);
        const scored=(p.touchdown)||(post.awaitingPAT&&post.patTeam===pre.possession);
        if(scored||(post.possession===pre.possession&&post.down===1)) t[pre.possession].fourthConv++;
      }
      if(p.type==='pass'&&p.interception) t[pre.possession].tos++;
    }
    if(p.type==='pat'){ if(pre.awaitingPAT&&pre.patTeam&&p.pat&&p.pat.good) t[pre.patTeam].points+=(p.pat.type==='2'?2:1); }
    else if((p.type==='pass'||p.type==='run')&&(p.touchdown||(typeof p.endSpot==='number'&&p.endSpot>=S.fieldLength))){ t[pre.possession].points+=6; }
    else if(p.type==='safety'){ t[pre.possession==='home'?'away':'home'].points+=2; }
    sim.push(p);
  });
  ['home','away'].forEach(sd=>{ const x=t[sd];
    x.ptsPerDrive=x.drives?(x.points/x.drives):0;
    x.avgStart=x.drives?(x.startSum/x.drives):0; });
  return t;
}
function passerRating(s){
  if(!s.att) return null;
  const clamp=(v)=>Math.max(0,Math.min(2.375,v));
  const a=clamp((s.comp/s.att-0.3)*5);
  const b=clamp((s.passYds/s.att-3)*0.25);
  const c=clamp((s.passTD/s.att)*20);
  const d=clamp(2.375-(s.int/s.att)*25);
  return Math.round(((a+b+c+d)/6)*100*10)/10;
}

/* ---- Shareable game report ---- */
function buildGameReport(g){
  const S=g.settings, st=deriveState(g.plays,S), stats=computeStats(g), tt=teamTotals(g), dr=computeDrives(g);
  const hn=g.teams.home.name, an=g.teams.away.name;
  const lines=[];
  lines.push(`${hn} ${st.home} — ${st.away} ${an}`);
  if(g.name) lines.push(g.name);
  lines.push('');
  lines.push('SCORING');
  let sim=[];
  g.plays.forEach(p=>{ const pre=deriveState(sim,S); const d=describePlay(g,p,pre);
    if(d.scoring){ const tag=prefs.clock&&p.half?`[H${p.half} ${p.clock!=null?fmtClock(p.clock):''}] `:'';
      const tm=pre.awaitingPAT?pre.patTeam:pre.possession;
      lines.push(`  ${tag}${g.teams[tm].name.slice(0,3).toUpperCase()}: ${d.desc}`); }
    sim.push(p); });
  lines.push('');
  ['home','away'].forEach(sd=>{
    lines.push(g.teams[sd].name.toUpperCase());
    lines.push(`  Yards ${tt[sd].yds} (pass ${tt[sd].passYds} / rush ${tt[sd].rushYds}) · TO ${dr[sd].tos}`);
    lines.push(`  Drives ${dr[sd].drives} · ${dr[sd].ptsPerDrive.toFixed(1)} pts/drive · avg start ${posLabel(g,Math.round(dr[sd].avgStart))} · 4th down ${dr[sd].fourthConv}/${dr[sd].fourthAtt}`);
    const rows=rosterOf(g,sd).map(p=>({p,s:stats[sd][p.id]})).filter(x=>x.s);
    rows.filter(x=>x.s.att>0).forEach(({p,s})=>lines.push(`  QB #${p.num} ${p.name}: ${s.comp}/${s.att}, ${s.passYds} yds, ${s.passTD} TD, ${s.int} INT, RTG ${passerRating(s)}`));
    const topR=rows.filter(x=>x.s.recYds>0).sort((a,b)=>b.s.recYds-a.s.recYds).slice(0,3);
    topR.forEach(({p,s})=>lines.push(`  #${p.num} ${p.name}: ${s.rec} rec, ${s.recYds} yds${s.recTD?`, ${s.recTD} TD`:''}`));
    const topD=rows.filter(x=>x.s.flags+x.s.defint+x.s.sacks>0).sort((a,b)=>(b.s.flags+b.s.sacks*2+b.s.defint*3)-(a.s.flags+a.s.sacks*2+a.s.defint*3)).slice(0,3);
    topD.forEach(({p,s})=>lines.push(`  #${p.num} ${p.name}: ${s.flags} flags${s.sacks?`, ${s.sacks} sacks`:''}${s.defint?`, ${s.defint} INT`:''}`));
    lines.push('');
  });
  lines.push('Logged with Flag Stats');
  return lines.join('\n');
}
function exportGameReport(g){
  const txt=buildGameReport(g);
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>toast('Report copied to clipboard')).catch(()=>{});
  downloadBlob(txt,(g.teams.home.name+'-'+g.teams.away.name+'-report').replace(/\s+/g,'_')+'.txt','text/plain');
}

/* ---- Standings ---- */
function computeStandings(gamesList){
  const tbl={};
  const row=(n)=>{ if(!tbl[n]) tbl[n]={team:n,pld:0,w:0,d:0,l:0,gf:0,ga:0}; return tbl[n]; };
  gamesList.forEach(g=>{
    if(!g.plays||!g.plays.length) return;
    const st=deriveState(g.plays,g.settings);
    const H=row(g.teams.home.name), A=row(g.teams.away.name);
    H.pld++; A.pld++; H.gf+=st.home; H.ga+=st.away; A.gf+=st.away; A.ga+=st.home;
    if(st.home>st.away){H.w++;A.l++;} else if(st.home<st.away){A.w++;H.l++;} else {H.d++;A.d++;}
  });
  const rows=Object.values(tbl).map(r=>({...r,gd:r.gf-r.ga,pct:r.pld?((r.w+0.5*r.d)/r.pld):0}));
  rows.sort((a,b)=>b.pct-a.pct||b.gd-a.gd||b.gf-a.gf||a.team.localeCompare(b.team));
  return rows;
}

function buildBoxScore(g){
  const wrap=h(`<div class="bs"></div>`);
  const stats=computeStats(g);
  const dr=computeDrives(g), tt=teamTotals(g);
  ['home','away'].forEach(side=>{
    wrap.appendChild(h(`<div class="bsTeam">${esc(g.teams[side].name)}</div>`));
    const rows=rosterOf(g,side).map(p=>({p,s:stats[side][p.id]})).filter(x=>x.s);
    if(!rows.length){ wrap.appendChild(h(`<div class="help">No stats yet.</div>`)); return; }
    // Team / drive summary
    const d=dr[side];
    wrap.appendChild(h(`<div class="help" style="margin-bottom:6px">
      ${tt[side].yds} yds (pass ${tt[side].passYds} / rush ${tt[side].rushYds}) ·
      ${d.drives} drives · ${d.ptsPerDrive.toFixed(1)} pts/drive ·
      avg start ${esc(posLabel(g,Math.round(d.avgStart)))} ·
      4th down ${d.fourthConv}/${d.fourthAtt} · TO ${d.tos}</div>`));
    // Offense table
    const off=rows.filter(x=>x.s.att||x.s.rec||x.s.rushAtt);
    if(off.length){
      let t=`<table><thead><tr><th>Player</th><th>C/A</th><th>Pyd</th><th>Rec</th><th>Ryd</th><th>Rush</th><th>TD</th></tr></thead><tbody>`;
      off.forEach(({p,s})=>{ t+=`<tr><td>#${esc(p.num)} ${esc(p.name||'')}</td>
        <td class="num">${s.comp}/${s.att}</td><td class="num">${s.passYds}</td>
        <td class="num">${s.rec}</td><td class="num">${s.recYds}</td>
        <td class="num">${s.rushYds}</td><td class="num">${s.passTD+s.recTD+s.rushTD}</td></tr>`; });
      t+=`</tbody></table>`; wrap.appendChild(h(t));
    }
    // QB efficiency lines
    rows.filter(x=>x.s.att>0).forEach(({p,s})=>{
      const cp=(100*s.comp/s.att).toFixed(0), ya=(s.passYds/s.att).toFixed(1);
      wrap.appendChild(h(`<div class="help" style="margin-top:4px"><b>QB #${esc(p.num)} ${esc(p.name||'')}</b> — ${cp}% comp · ${ya} yds/att · ${s.passTD} TD : ${s.int} INT · RTG <b>${passerRating(s)}</b></div>`));
    });
    // Defense table
    const def=rows.filter(x=>x.s.flags||x.s.sacks||x.s.pbu||x.s.defint||x.s.missedFlags);
    if(def.length){
      let t=`<table style="margin-top:8px"><thead><tr><th>Defense</th><th>Flags</th><th>TFL</th><th>Sack</th><th>PBU</th><th>INT</th><th>Miss</th></tr></thead><tbody>`;
      def.forEach(({p,s})=>{ t+=`<tr><td>#${esc(p.num)} ${esc(p.name||'')}</td>
        <td class="num">${s.flags}</td><td class="num">${s.tfl}</td><td class="num">${s.sacks}</td>
        <td class="num">${s.pbu}</td><td class="num">${s.defint}</td><td class="num">${s.missedFlags}</td></tr>`; });
      t+=`</tbody></table>`; wrap.appendChild(h(t));
    }
    // Conversions (PAT / 2-pt)
    const scorers=rows.filter(x=>x.s.convMade).map(({p,s})=>`#${esc(p.num)} ${s.convPts}pt`).join(' · ');
    const throwers=rows.filter(x=>x.s.convThrow).map(({p,s})=>`#${esc(p.num)} (${s.convThrow})`).join(' · ');
    if(scorers||throwers){
      let html=`<div class="help" style="margin-top:6px"><b>Conversions</b> — ${scorers||'—'}`;
      if(throwers) html+=` · thrown by ${throwers}`;
      html+=`</div>`;
      wrap.appendChild(h(html));
    }
  });
  // export
  const exp=h(`<div class="flexbtns" style="margin-top:12px"></div>`);
  const b=h(`<button class="btn sm blue">Export game (JSON)</button>`); b.onclick=()=>exportGame(g);
  const r=h(`<button class="btn sm green">Game report</button>`); r.onclick=()=>exportGameReport(g);
  exp.appendChild(b); exp.appendChild(r); wrap.appendChild(exp);
  return wrap;
}

  csvBtn.onclick=()=>downloadTourneyCSV(all);

function downloadTourneyCSV(all){
  const cols=['team','num','name','att','comp','passYds','passTD','int','tgt','rec','recYds','recTD','drops','rushAtt','rushYds','rushTD','flags','tfl','sacks','pbu','defint','intRetYds','missedFlags','convThrow','convMade','convPts'];
  let csv=cols.join(',')+'\n';
  all.forEach(a=>{ const row=cols.map(c=>{ if(c in a) return csvCell(a[c]); return a.line[c]??0; }); csv+=row.join(',')+'\n'; });
  downloadBlob(csv,'nations-cup-stats.csv','text/csv');
}
function csvCell(v){ v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }

/* ============================================================
   EXPORT / DOWNLOAD
   ============================================================ */
function gameFileName(g,ext){
  const st=g.plays.length?deriveState(g.plays,g.settings):null;
  const parts=[g.teams.home.name+'-vs-'+g.teams.away.name];
  if(g.name) parts.push(g.name);
  if(st) parts.push(st.home+'-'+st.away);
  return parts.join('_').replace(/[^\w.\-]+/g,'_').replace(/_+/g,'_')+ext;
}
function exportGame(g){
  downloadBlob(JSON.stringify(g,null,2), gameFileName(g,'.json'),'application/json');
  g.exportedPlays=g.plays.length; // remember what was backed up (for delete safeguards)
  if(games.includes(g)) persist();
}
/* One-tap share (Web Share API) — sends the JSON straight to WhatsApp/Signal/Mail.
   Falls back to a normal download where sharing files isn't supported. */
async function shareGame(g){
  const json=JSON.stringify(g,null,2);
  try{
    const file=new File([json],gameFileName(g,'.json'),{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:gameFileName(g,'')});
      g.exportedPlays=g.plays.length; if(games.includes(g)) persist(); render();
      toast('Shared'); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; /* user cancelled: not exported */ }
  exportGame(g); // fallback
}
/* ---- LIVE SYNC (optional) ----
   Local-first broadcasting: this device stays the source of truth and pushes a
   copy of the ACTIVE game to its own JSONBin bin after each change (debounced).
   One device = one bin = one writer, so there are no sync conflicts.
   Offline? Nothing breaks — it retries when the connection returns. */
let syncTimer=null, lastPush=0;
function autoMode(){ return !!LIVE_CONFIG.url && prefs.syncOn!==false; } // built-in config: on by default, opt-out via toggle
function manualMode(){ return !LIVE_CONFIG.url && prefs.syncOn && (prefs.syncKey||'').trim() && (prefs.syncBin||'').trim(); }
function syncConfigured(){ return autoMode()||manualMode(); }
function schedulePush(){
  if(!syncConfigured()) return;
  clearTimeout(syncTimer);
  const throttle=autoMode()?15000:20000; // gentle on free tiers
  const wait = (Date.now()-lastPush>throttle) ? 400 : (autoMode()?15000:8000);
  updateSyncChip('pending');
  syncTimer=setTimeout(pushActive, wait);
}
async function pushActive(){
  const g=activeGame(); if(!g||!syncConfigured()) return;
  if(!g.plays.length){ return; } // nothing to broadcast — keeps viewer devices silent
  lastPush=Date.now();
  try{
    const payload={type:'flagstats-live',updated:Date.now(),device:deviceId,game:g};
    let r;
    if(autoMode()){
      const q=LIVE_CONFIG.token?('?t='+encodeURIComponent(LIVE_CONFIG.token)):'';
      r=await fetch(LIVE_CONFIG.url.replace(/\/$/,'')+'/g/'+deviceId+q,{
        method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    } else {
      r=await fetch('https://api.jsonbin.io/v3/b/'+prefs.syncBin.trim(),{
        method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':prefs.syncKey.trim()},
        body:JSON.stringify(payload)});
    }
    if(!r.ok) throw new Error('http '+r.status);
    g._syncedPlays=g.plays.length;
    updateSyncChip('ok');
  }catch(e){ updateSyncChip('err'); }
}
function updateSyncChip(state){
  const el=document.getElementById('syncChip'); if(!el) return;
  const map={ok:['● LIVE','var(--green)'],pending:['● syncing…','var(--amber)'],err:['● offline','var(--red)']};
  const m=map[state]; if(m){ el.textContent=m[0]; el.style.color=m[1]; }
}
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('online',()=>{ if(syncConfigured()) schedulePush(); });
}

/* ---- LIVE VIEWER: poll other tablets' bins (read-only role) ---- */
let liveGames={}, liveTimer=null, liveFetching=false, liveExpand={}, liveStatus='';
function viewBinIds(){ return (prefs.viewBins||'').split(',').map(s=>s.trim()).filter(Boolean); }
function viewerConfigured(){ return autoMode() || (viewBinIds().length && (prefs.syncKey||'').trim()); }
async function fetchLive(force){
  if(liveFetching && !force) return;
  liveFetching=true;
  try{
    if(autoMode()){
      const q=LIVE_CONFIG.token?('?t='+encodeURIComponent(LIVE_CONFIG.token)):'';
      const r=await fetch(LIVE_CONFIG.url.replace(/\/$/,'')+'/g'+q,{cache:'no-store'});
      if(!r.ok){ liveStatus='error: server said '+r.status+(r.status===403?' (token mismatch)':''); }
      else {
        let arr=null;
        try{ arr=await r.json(); }catch(e){ liveStatus='error: unexpected response (not JSON)'; }
        if(Array.isArray(arr)){
          arr.forEach(rec=>{ if(rec&&rec.game) liveGames[rec.device||rec.game.id]=rec; });
          liveStatus='last check '+new Date().toLocaleTimeString()+' · '+arr.length+' broadcast(s) on server';
        } else if(arr!==null){ liveStatus='error: unexpected response shape'; }
      }
    } else {
      for(const id of viewBinIds()){
        try{
          const r=await fetch('https://api.jsonbin.io/v3/b/'+id+'/latest',{headers:{'X-Master-Key':(prefs.syncKey||'').trim()},cache:'no-store'});
          if(!r.ok) continue;
          const j=await r.json();
          if(j&&j.record&&j.record.game) liveGames[id]=j.record;
        }catch(e){}
      }
      liveStatus='last check '+new Date().toLocaleTimeString();
    }
  }catch(e){ liveStatus='error: '+(e&&e.message?e.message:'network failure'); }
  liveFetching=false;
  if(typeof curTab!=='undefined' && curTab==='tourney') render();
}
function startLivePolling(){ stopLivePolling();
  if(viewerConfigured()){ fetchLive(); liveTimer=setInterval(fetchLive,20000); } }
function stopLivePolling(){ if(liveTimer){ clearInterval(liveTimer); liveTimer=null; } }

/* Roster sync: enter real squads once, share to the other tablets */
async function shareTeams(){
  const payload={type:'flagstats-teams',exported:new Date().toISOString(),teams};
  const json=JSON.stringify(payload);
  const fname='flagstats-rosters.json';
  try{
    const file=new File([json],fname,{type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Flag Stats rosters'}); toast('Rosters shared'); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  downloadBlob(json,fname,'application/json');
}
/* Whole-day bundle: every played game in one file (one file per tablet per day) */
function exportBundle(){
  const played=games.filter(g=>g.plays.length>0);
  if(!played.length){ toast('No played games to export'); return; }
  const bundle={type:'flagstats-bundle',exported:new Date().toISOString(),games:played};
  downloadBlob(JSON.stringify(bundle),'flagstats-bundle_'+new Date().toISOString().slice(0,10)+'.json','application/json');
  played.forEach(g=>{ g.exportedPlays=g.plays.length; });
  persist(); render(); toast(played.length+' games exported in one file');
}
function downloadBlob(data,filename,type){
  const blob=new Blob([data],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ============================================================
   SHELL
   ============================================================ */
let curTab='game';
function switchTab(t){ curTab=t;
  if(t==='tourney') startLivePolling(); else stopLivePolling();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('view-'+t).classList.add('on');
  render();
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
function render(){
  if(curTab==='game') renderGame();
  else if(curTab==='setup') renderSetup();
  else renderTourney();
}
let toastTimer;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1400); }

// first-run: seed the 7 test nations and land on setup
if(!Object.keys(teams).length && !games.length){ loadTestTeams(); }
if(!games.length){ curTab='setup'; }
applyPrefs();
ensureWakeLock();
switchTab(curTab);

// Offline support (only over http/https, not file://). Network-first, so an online
// device always gets the newest push; offline falls back to the last cached copy.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
